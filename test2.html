<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="test.css">
    <title>Joystick</title>
</head>
<body>
    <h1>My joystick</h1>
    <div id="text">
            <textarea name="test" id="vvod" autofocus></textarea>
    </div>
    <div id="box1">
        <div id="left">L</div>
        <div id="up">U</div>
        <div id="right">R</div>
        <div id="down">D</div>
        <div id="circle"></div>
    </div>
    <div id="box2">
        <svg height="100" width="100">
        <polygon points="50,15 100,100 0,100" style="fill:lime;stroke:purple;stroke-width:1" />
        </svg>
        <div class="triangle-clip"></div>
        <div class="triangle"></div>
    </div>
</body>
</html>
<script>
    const vvod = document.getElementById('vvod');
    const circle = document.getElementById('circle');
    circle.addEventListener('click', () => {
        vvod.focus();
    });
</script>
